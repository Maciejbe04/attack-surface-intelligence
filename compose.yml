name: surfacex

x-backend-build: &backend-build
  context: .
  dockerfile: deploy/docker/Dockerfile.api

x-api-env: &api-env
  DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,gateway,api}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
  SECURE_COOKIES: ${SECURE_COOKIES:-0}
  POSTGRES_DB: ${POSTGRES_DB:-surfacex}
  POSTGRES_USER: ${POSTGRES_USER:-surfacex}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
  CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/2}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080,http://localhost:18080,http://127.0.0.1:18080}
  BOOTSTRAP_ADMIN_USER: ${BOOTSTRAP_ADMIN_USER:-admin}
  BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-changeme}

services:
  gateway:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.gateway
    image: surfacex-gateway:local
    restart: unless-stopped
    ports:
      - "${GATEWAY_HTTP_PORT:-8080}:8080"
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - edge
      - backend
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/cache/nginx:size=16m,uid=101,gid=101,mode=0755
      - /var/run:size=8m,uid=101,gid=101,mode=0755
    mem_limit: 128m
    pids_limit: 128
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.web
    image: surfacex-web:local
    restart: unless-stopped
    networks:
      - edge
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/cache/nginx:size=16m,uid=101,gid=101,mode=0755
      - /var/run:size=8m,uid=101,gid=101,mode=0755
    mem_limit: 128m
    pids_limit: 64
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s

  api:
    build: *backend-build
    image: surfacex-api:local
    restart: unless-stopped
    command: ["/app/deploy/docker/entrypoint-api.sh"]
    environment:
      <<: *api-env
    env_file:
      - path: .env
        required: false
    secrets:
      - postgres_password
      - django_secret_key
      - app_data_key
      - session_hmac
      - worker_token
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m
    mem_limit: ${API_MEMORY_LIMIT:-512m}
    pids_limit: 256
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  scheduler:
    image: surfacex-api:local
    pull_policy: never
    restart: unless-stopped
    command:
      [
        "celery",
        "-A",
        "config",
        "beat",
        "--loglevel=INFO",
        "--schedule=/tmp/celerybeat-schedule",
      ]
    environment:
      <<: *api-env
    env_file:
      - path: .env
        required: false
    secrets:
      - postgres_password
      - django_secret_key
      - app_data_key
      - session_hmac
      - worker_token
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=32m
    mem_limit: 256m
    pids_limit: 128
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import redis,os; redis.from_url(os.environ['CELERY_BROKER_URL']).ping()",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  worker:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.worker
      args:
        HTTPX_VERSION: ${HTTPX_VERSION:-v1.6.9}
    image: surfacex-worker:local
    restart: unless-stopped
    command:
      [
        "celery",
        "-A",
        "config",
        "worker",
        "--loglevel=INFO",
        "--queues=scan",
        "--concurrency=${WORKER_CONCURRENCY:-2}",
        "--prefetch-multiplier=1",
      ]
    environment:
      <<: *api-env
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:8000}
      ROLE: worker
    env_file:
      - path: .env
        required: false
    secrets:
      - worker_token
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
      - scanner
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=256m
    mem_limit: ${WORKER_MEMORY_LIMIT:-1g}
    pids_limit: 256
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping --destination=celery@$$HOSTNAME --timeout=5 | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-surfacex}
      POSTGRES_USER: ${POSTGRES_USER:-surfacex}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-512m}
    pids_limit: 128
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=8m
    mem_limit: ${REDIS_MEMORY_LIMIT:-256m}
    pids_limit: 64
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  backup:
    image: surfacex-api:local
    pull_policy: never
    restart: unless-stopped
    user: "0:0"
    command: ["/app/deploy/docker/backup-loop.sh"]
    environment:
      <<: *api-env
      BACKUP_INTERVAL_SECONDS: "86400"
    secrets:
      - postgres_password
      - backup_key
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - backup_data:/backups
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m
    mem_limit: 256m
    pids_limit: 64

networks:
  edge:
  backend:
    internal: true
  scanner:

volumes:
  postgres_data:
  backup_data:

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  django_secret_key:
    file: ./secrets/django_secret_key
  app_data_key:
    file: ./secrets/app_data_key
  backup_key:
    file: ./secrets/backup_key
  session_hmac:
    file: ./secrets/session_hmac
  worker_token:
    file: ./secrets/worker_token
