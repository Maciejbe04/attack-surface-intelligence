name: surfacex

x-backend-build: &backend-build
  context: .
  dockerfile: deploy/docker/Dockerfile.api

x-api-env: &api-env
  DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,gateway,api}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
  SECURE_COOKIES: ${SECURE_COOKIES:-0}
  POSTGRES_DB: ${POSTGRES_DB:-surfacex}
  POSTGRES_USER: ${POSTGRES_USER:-surfacex}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
  CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
  SCAN_RECONCILE_INTERVAL_SECONDS: ${SCAN_RECONCILE_INTERVAL_SECONDS:-60}
  SCAN_RECONCILE_STALE_SECONDS: ${SCAN_RECONCILE_STALE_SECONDS:-600}
  SCAN_RECONCILE_BATCH_LIMIT: ${SCAN_RECONCILE_BATCH_LIMIT:-100}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/2}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080,http://localhost:18080,http://127.0.0.1:18080}
  CSRF_PROTECT: ${CSRF_PROTECT:-0}
  BOOTSTRAP_ADMIN_USER: ${BOOTSTRAP_ADMIN_USER:-admin}
  BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-changeme}
  SEED_LAB_TARGET: ${SEED_LAB_TARGET:-1}
  APP_NAME: ${APP_NAME:-SurfaceX}
  APP_VERSION: ${APP_VERSION:-0.1.0}
  WEB_VERSION: ${WEB_VERSION:-0.1.0}
  HTTPX_VERSION: ${HTTPX_VERSION:-v1.6.9}
  DEFECTDOJO_VERSION: ${DEFECTDOJO_VERSION:-3.5.202}
  DEFECTDOJO_URL: ${DEFECTDOJO_URL:-http://defectdojo:8080}
  DEFECTDOJO_USERNAME: ${DEFECTDOJO_USERNAME:-admin}
  DEFECTDOJO_PRODUCT_TYPE: ${DEFECTDOJO_PRODUCT_TYPE:-SurfaceX}
  DEFECTDOJO_PRODUCT_NAME: ${DEFECTDOJO_PRODUCT_NAME:-Attack Surface}
  DEFECTDOJO_ENGAGEMENT_NAME: ${DEFECTDOJO_ENGAGEMENT_NAME:-SurfaceX Discovery}
  DEFECTDOJO_TEST_TITLE: ${DEFECTDOJO_TEST_TITLE:-SurfaceX Discovery}
  DEFECTDOJO_TIMEOUT_SECONDS: ${DEFECTDOJO_TIMEOUT_SECONDS:-30}

x-defectdojo-env: &defectdojo-env
  DD_DATABASE_URL_FILE: /run/secrets/defectdojo_database_url
  DD_CELERY_BROKER_URL: redis://defectdojo-valkey:6379/0
  DD_CACHE_URL: redis://defectdojo-valkey:6379/1
  DD_SECRET_KEY_FILE: /run/secrets/defectdojo_secret_key
  DD_CREDENTIAL_AES_256_KEY_FILE: /run/secrets/defectdojo_credential_key
  DD_DATABASE_READINESS_TIMEOUT: "60"
  # CSRF is disabled via deploy/defectdojo/extra_settings/local_settings.py
  # (CsrfViewMiddleware removed). Keep trusted origins as a safety net if
  # someone re-enables the middleware later.
  DD_CSRF_TRUSTED_ORIGINS: ${DD_CSRF_TRUSTED_ORIGINS:-http://localhost:8081,http://127.0.0.1:8081,http://localhost:18081,http://127.0.0.1:18081,https://dojo.opselis.pl,http://dojo.opselis.pl}

x-defectdojo-extra-settings-vol: &defectdojo-extra-settings-vol ./deploy/defectdojo/extra_settings:/app/docker/extra_settings:ro

services:
  gateway:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.gateway
    image: surfacex-gateway:local
    restart: unless-stopped
    ports:
      - "${GATEWAY_HTTP_PORT:-8080}:8080"
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - edge
      - backend
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/cache/nginx:size=16m,uid=101,gid=101,mode=0755
      - /var/run:size=8m,uid=101,gid=101,mode=0755
    mem_limit: 128m
    pids_limit: 128
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.web
    image: surfacex-web:local
    restart: unless-stopped
    networks:
      - edge
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/cache/nginx:size=16m,uid=101,gid=101,mode=0755
      - /var/run:size=8m,uid=101,gid=101,mode=0755
    mem_limit: 128m
    pids_limit: 64
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s

  api:
    build: *backend-build
    image: surfacex-api:local
    restart: unless-stopped
    command: ["/app/deploy/docker/entrypoint-api.sh"]
    environment:
      <<: *api-env
      DEFECTDOJO_API_TOKEN: ${DEFECTDOJO_API_TOKEN:-}
    env_file:
      - path: .env
        required: false
    secrets:
      - postgres_password
      - django_secret_key
      - app_data_key
      - session_hmac
      - worker_token
      - defectdojo_admin_password
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m
    mem_limit: ${API_MEMORY_LIMIT:-512m}
    pids_limit: 256
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  scheduler:
    image: surfacex-api:local
    pull_policy: never
    restart: unless-stopped
    command:
      [
        "celery",
        "-A",
        "config",
        "beat",
        "--loglevel=INFO",
        "--schedule=/tmp/celerybeat-schedule",
      ]
    environment:
      <<: *api-env
    env_file:
      - path: .env
        required: false
    secrets:
      - postgres_password
      - django_secret_key
      - app_data_key
      - session_hmac
      - worker_token
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=32m
    mem_limit: 256m
    pids_limit: 128
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import redis,os; redis.from_url(os.environ['CELERY_BROKER_URL']).ping()",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  worker:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.worker
      args:
        HTTPX_VERSION: ${HTTPX_VERSION:-v1.6.9}
    image: surfacex-worker:local
    restart: unless-stopped
    command:
      [
        "celery",
        "-A",
        "config",
        "worker",
        "--loglevel=INFO",
        "--queues=scan",
        "--concurrency=${WORKER_CONCURRENCY:-2}",
        "--prefetch-multiplier=1",
      ]
    environment:
      <<: *api-env
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:8000}
      ROLE: worker
    env_file:
      - path: .env
        required: false
    secrets:
      - worker_token
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
      lab-target:
        condition: service_healthy
    networks:
      - backend
      - scanner
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=256m
    mem_limit: ${WORKER_MEMORY_LIMIT:-1g}
    pids_limit: 256
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping --destination=celery@$$HOSTNAME --timeout=5 | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  defectdojo:
    profiles: ["defectdojo"]
    image: ${DD_IMAGE_REGISTRY:-registry.defectdojo.com}/defectdojo/defectdojo-nginx:${DEFECTDOJO_VERSION:-3.5.202}
    restart: unless-stopped
    depends_on:
      defectdojo-uwsgi:
        condition: service_started
    environment:
      DD_UWSGI_HOST: defectdojo-uwsgi
      DD_UWSGI_PORT: "3031"
      NGINX_METRICS_ENABLED: "false"
    volumes:
      - defectdojo_media:/usr/share/nginx/html/media
    ports:
      - "${DEFECTDOJO_HTTP_PORT:-8081}:8080"
    networks:
      - edge
      - backend
      - defectdojo
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    pids_limit: 128
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/login"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s

  defectdojo-uwsgi:
    profiles: ["defectdojo"]
    image: ${DD_IMAGE_REGISTRY:-registry.defectdojo.com}/defectdojo/defectdojo-django:${DEFECTDOJO_VERSION:-3.5.202}
    restart: unless-stopped
    entrypoint:
      [
        "/wait-for-it.sh",
        "defectdojo-postgres:5432",
        "-t",
        "60",
        "--",
        "/entrypoint-uwsgi.sh",
      ]
    environment:
      <<: *defectdojo-env
      DD_DEBUG: "False"
      DD_ALLOWED_HOSTS: "*"
      DD_UWSGI_HOST: 0.0.0.0
      DD_UWSGI_PORT: "3031"
    secrets:
      - defectdojo_database_url
      - defectdojo_secret_key
      - defectdojo_credential_key
    depends_on:
      defectdojo-initializer:
        condition: service_completed_successfully
      defectdojo-postgres:
        condition: service_healthy
      defectdojo-valkey:
        condition: service_healthy
    volumes:
      - defectdojo_media:/app/media
      - *defectdojo-extra-settings-vol
    networks:
      - defectdojo
    security_opt:
      - no-new-privileges:true
    mem_limit: ${DEFECTDOJO_APP_MEMORY_LIMIT:-1g}
    pids_limit: 512

  defectdojo-celerybeat:
    profiles: ["defectdojo"]
    image: ${DD_IMAGE_REGISTRY:-registry.defectdojo.com}/defectdojo/defectdojo-django:${DEFECTDOJO_VERSION:-3.5.202}
    restart: unless-stopped
    entrypoint:
      [
        "/wait-for-it.sh",
        "defectdojo-postgres:5432",
        "-t",
        "60",
        "--",
        "/entrypoint-celery-beat.sh",
      ]
    environment:
      <<: *defectdojo-env
    secrets:
      - defectdojo_database_url
      - defectdojo_secret_key
      - defectdojo_credential_key
    depends_on:
      defectdojo-initializer:
        condition: service_completed_successfully
      defectdojo-postgres:
        condition: service_healthy
      defectdojo-valkey:
        condition: service_healthy
    volumes:
      - *defectdojo-extra-settings-vol
    networks:
      - defectdojo
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 256

  defectdojo-celeryworker:
    profiles: ["defectdojo"]
    image: ${DD_IMAGE_REGISTRY:-registry.defectdojo.com}/defectdojo/defectdojo-django:${DEFECTDOJO_VERSION:-3.5.202}
    restart: unless-stopped
    entrypoint:
      [
        "/wait-for-it.sh",
        "defectdojo-postgres:5432",
        "-t",
        "60",
        "--",
        "/entrypoint-celery-worker.sh",
      ]
    environment:
      <<: *defectdojo-env
    secrets:
      - defectdojo_database_url
      - defectdojo_secret_key
      - defectdojo_credential_key
    depends_on:
      defectdojo-initializer:
        condition: service_completed_successfully
      defectdojo-postgres:
        condition: service_healthy
      defectdojo-valkey:
        condition: service_healthy
    volumes:
      - defectdojo_media:/app/media
      - *defectdojo-extra-settings-vol
    networks:
      - defectdojo
    security_opt:
      - no-new-privileges:true
    mem_limit: ${DEFECTDOJO_WORKER_MEMORY_LIMIT:-1g}
    pids_limit: 512

  defectdojo-initializer:
    profiles: ["defectdojo"]
    image: ${DD_IMAGE_REGISTRY:-registry.defectdojo.com}/defectdojo/defectdojo-django:${DEFECTDOJO_VERSION:-3.5.202}
    restart: "no"
    entrypoint:
      [
        "/wait-for-it.sh",
        "defectdojo-postgres:5432",
        "-t",
        "60",
        "--",
        "/entrypoint-initializer.sh",
      ]
    environment:
      <<: *defectdojo-env
      DD_ADMIN_USER: ${DEFECTDOJO_USERNAME:-admin}
      DD_ADMIN_PASSWORD_FILE: /run/secrets/defectdojo_admin_password
      DD_ADMIN_MAIL: ${DEFECTDOJO_ADMIN_EMAIL:-admin@defectdojo.local}
      DD_ADMIN_FIRST_NAME: SurfaceX
      DD_ADMIN_LAST_NAME: Admin
      DD_INITIALIZE: "true"
    secrets:
      - defectdojo_database_url
      - defectdojo_secret_key
      - defectdojo_credential_key
      - defectdojo_admin_password
    depends_on:
      defectdojo-postgres:
        condition: service_healthy
    volumes:
      - *defectdojo-extra-settings-vol
    networks:
      - defectdojo
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    pids_limit: 512

  defectdojo-postgres:
    profiles: ["defectdojo"]
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      PGDATA: /var/lib/postgresql/data
      POSTGRES_DB: defectdojo
      POSTGRES_USER: defectdojo
      POSTGRES_PASSWORD_FILE: /run/secrets/defectdojo_db_password
    secrets:
      - defectdojo_db_password
    volumes:
      - defectdojo_postgres:/var/lib/postgresql/data
    networks:
      - defectdojo
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 256
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U defectdojo -d defectdojo"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  defectdojo-valkey:
    profiles: ["defectdojo"]
    image: valkey/valkey:9.1.2-alpine
    restart: unless-stopped
    volumes:
      - defectdojo_valkey:/data
    networks:
      - defectdojo
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 128
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-surfacex}
      POSTGRES_USER: ${POSTGRES_USER:-surfacex}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-512m}
    pids_limit: 128
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=8m
    mem_limit: ${REDIS_MEMORY_LIMIT:-256m}
    pids_limit: 64
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  lab-target:
    build:
      context: ./deploy/lab-target
    image: surfacex-lab-target:local
    hostname: lab-target.surfacex.local
    restart: unless-stopped
    ports:
      - "${LAB_HTTP_PORT:-18088}:80"
    networks:
      scanner:
        ipv4_address: 172.30.0.10
        aliases:
          - lab-target.surfacex.local
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
      - /var/cache/nginx:size=8m,uid=101,gid=101,mode=0755
      - /var/run:size=4m,uid=101,gid=101,mode=0755
    mem_limit: 64m
    pids_limit: 64
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s

  backup:
    image: surfacex-api:local
    pull_policy: never
    restart: unless-stopped
    user: "0:0"
    command: ["/app/deploy/docker/backup-loop.sh"]
    environment:
      <<: *api-env
      BACKUP_INTERVAL_SECONDS: "86400"
    secrets:
      - postgres_password
      - backup_key
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - backup_data:/backups
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m
    mem_limit: 256m
    pids_limit: 64

networks:
  edge:
  backend:
    internal: true
  scanner:
    ipam:
      config:
        - subnet: 172.30.0.0/24
  defectdojo:
    internal: true

volumes:
  postgres_data:
  backup_data:
  defectdojo_postgres:
  defectdojo_media:
  defectdojo_valkey:

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  django_secret_key:
    file: ./secrets/django_secret_key
  app_data_key:
    file: ./secrets/app_data_key
  backup_key:
    file: ./secrets/backup_key
  session_hmac:
    file: ./secrets/session_hmac
  worker_token:
    file: ./secrets/worker_token
  defectdojo_admin_password:
    file: ./secrets/defectdojo_admin_password
  defectdojo_db_password:
    file: ./secrets/defectdojo_db_password
  defectdojo_database_url:
    file: ./secrets/defectdojo_database_url
  defectdojo_secret_key:
    file: ./secrets/defectdojo_secret_key
  defectdojo_credential_key:
    file: ./secrets/defectdojo_credential_key
