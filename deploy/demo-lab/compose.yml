# SurfaceX demo lab: a target whose ports/services change every PHASE_SECONDS.
# Runs on its own isolated network; ports are published only on 127.0.0.1.
#   docker compose -f deploy/demo-lab/compose.yml up -d
# Let the SurfaceX worker reach it and allow the range in the scan allowlist:
#   docker network connect surfacex-demo-lab <worker-container>
#   SCAN_ALLOWED_NETWORKS=172.30.0.0/24   (target: 172.30.0.20)
name: surfacex-demo-lab

services:
  flapper:
    image: python:3.12-alpine
    command: ["python", "-u", "/lab/flapper.py"]
    environment:
      PHASE_SECONDS: ${PHASE_SECONDS:-90}
    volumes:
      - ./flapper.py:/lab/flapper.py:ro
    ports:
      - "127.0.0.1:18765:80"  # control: /state, /next
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    mem_limit: 48m
    restart: unless-stopped
    networks:
      demo:
        ipv4_address: 172.30.0.20

networks:
  demo:
    name: surfacex-demo-lab
    ipam:
      config:
        - subnet: 172.30.0.0/24
